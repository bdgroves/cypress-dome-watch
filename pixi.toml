[workspace]
name = "cypress-dome-watch"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.11"
requests = "*"
numpy = "*"
scipy = "*"
scikit-image = "*"
pdal = ">=2.6"
python-pdal = "*"
rasterio = "*"
pyproj = "*"
matplotlib-base = "*"
pillow = "*"

[tasks]
find-lidar = "python src/find_lidar.py"
demo = "python src/detect_domes.py"
build = "python src/build_chm.py"
serve = "python -m http.server 8000 --directory docs"
