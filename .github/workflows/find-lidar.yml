name: Find LiDAR tiles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: false
      - run: pixi run find-lidar
      - run: pixi run demo
      - name: Commit results
        run: |
          git config user.name "cypress-dome-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lidar_tiles.json
          git diff --cached --quiet || git commit -m "data: 3DEP LiDAR tile list for Big Cypress test area"
          git push
